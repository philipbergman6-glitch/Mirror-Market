# One-shot, manually dispatched backfill of US Gulf export bid history over
# the MARS API (#283). This workflow exists because data/history/*.csv is
# written only by CI (the history-guard job fails a PR that touches it): the
# backfill has to run on a runner, store into a DB seeded from the committed
# CSVs, and let export_history + the snapshot commit persist what it fetched.
# A local run of scripts/backfill_gulf_bids_mars.py fills a local DB and
# persists nothing.
name: Backfill Gulf bids (MARS)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'archive = one pull of everything; per-date = walk report dates one at a time'
        type: choice
        options: ['archive', 'per-date']
        default: 'archive'
        required: true
      start:
        description: 'per-date only — start date (ISO). Empty = 2020-02-24, the first date MARS serves.'
        default: ''
        required: false
      end:
        description: 'per-date only — end date (ISO). Empty = today.'
        default: ''
        required: false

permissions:
  contents: write

# Its own group, deliberately NOT `pages`. Sharing that group with the deploy
# looked like mutual exclusion and was really exposure: deploy-dashboard sets
# `cancel-in-progress: github.event_name == 'push'`, so every push to main
# cancels the whole group — and a dispatched backfill, which sits queued
# behind whatever is running, is cancelled before it is ever assigned a
# runner. Observed on run 32555346703: dispatched, queued, killed by the merge
# push, with `data/history/gulf_bids.csv` never written and nothing but a
# "cancelled" badge to say so.
#
# Exclusion against the other history writers is still required — they export
# `data/history` from their own DB, so one that started before our commit will
# push a snapshot that does not contain the backfill — but it is enforced by
# *waiting* below, where a queue cannot turn into a cancellation, and checked
# again after the push.
concurrency:
  group: backfill-gulf-bids
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    # The archive pull is one request; the per-date walk is ~1,700 of them at
    # a 0.5s delay plus request time.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The exclusion the shared `pages` group used to provide, minus the
      # cancellation. Anything that exports data/history must finish first, or
      # its snapshot — taken from a DB seeded before our rows existed — lands
      # after ours and silently shortens the file.
      - name: Wait for other history writers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 40); do
            busy=$(gh run list --limit 40 --json workflowName,status --jq '
              [ .[]
                | select(.status == "in_progress" or .status == "queued")
                | select(.workflowName | test("^(Update Dashboard|Refresh Prices|Backfill MAGyP FOB)$"))
              ] | length')
            if [ "$busy" -eq 0 ]; then
              echo "No other history writer running."
              exit 0
            fi
            echo "$busy history writer(s) active — waiting 30s (attempt $attempt/40)."
            sleep 30
          done
          echo "::error::other history writers still running after 20 minutes; not racing them"
          exit 1

      # Seed the empty runner DB from the committed CSVs first. Two reasons:
      # export_history below must see existing rows + backfill rather than a
      # shrink, and the backfill's pre-write cross-check compares the API
      # mapping against the PDF-parsed rows those CSVs hold — on an empty DB
      # there is nothing to check it against.
      - name: Seed DB from committed history
        run: |
          python -c "
          from pipeline.store import init_database
          from pipeline.history import import_history
          init_database()
          import_history()
          "

      - name: Run backfill
        env:
          MARS_API_KEY: ${{ secrets.MARS_API_KEY }}
        run: |
          if [ "${{ inputs.mode }}" = "per-date" ]; then
            python scripts/backfill_gulf_bids_mars.py --per-date "${{ inputs.start }}" ${{ inputs.end }}
          else
            python scripts/backfill_gulf_bids_mars.py
          fi

      - name: Export history
        run: python -c "from pipeline.history import export_history; export_history()"

      - name: Commit history snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history
          if git diff --staged --quiet; then
            echo "No history changes — nothing to commit."
            exit 0
          fi
          git commit -m "chore(data): backfill US Gulf export bid history (MARS) [skip ci]"
          for attempt in 1 2 3; do
            if git push origin main; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — rebasing onto moved main."
            git pull --rebase -X theirs --autostash origin main
          done
          echo "::error::backfill history push failed after 3 attempts"
          exit 1

      # Waiting narrows the race; it does not close it. A deploy that started
      # while the archive was downloading exports from a DB that predates these
      # rows and can push a shorter file over ours minutes later. Read main
      # back and say so, loudly — a backfill that ends green having written
      # nothing is the silent failure this repo exists not to have.
      - name: Verify the snapshot survived
        run: |
          exported=$(($(wc -l < data/history/gulf_bids.csv) - 1))
          git fetch --depth=1 origin main
          on_main=$(($(git show FETCH_HEAD:data/history/gulf_bids.csv | wc -l) - 1))
          echo "exported $exported rows; data/history/gulf_bids.csv on main holds $on_main"
          if [ "$on_main" -lt "$exported" ]; then
            echo "::error::main holds $on_main rows against the $exported just exported — a concurrent history writer overwrote the backfill. Re-dispatch when the repo is quiet."
            exit 1
          fi
