name: Update Dashboard

on:
  schedule:
    # Weekdays, nominally 19:00 UTC. GitHub's scheduler is best-effort and
    # runs late: across 30 observed scheduled runs the delay was +64 to
    # +298 min (median +138), so the real landing window is ~20:00–24:00 UTC.
    # That window is what this time is chosen for, not the cron string:
    #   CBOT settles 18:15 UTC (CDT) / 19:15 UTC (CST)  -> same-day settled
    #   Argentina MAGyP FOB publishes after ~15:05 UTC  -> same-day
    #   AMS Gulf bids (report 3147) ~18:48 UTC          -> same-day
    # Brazil CEPEA publishes after 21:01 UTC, so it is picked up on the
    # later landings only and stays D-1 in the worst case; a slot late
    # enough to guarantee it would routinely spill past UTC midnight.
    # The previous '0 12' landed ~14:15 UTC, ~4 h BEFORE the CBOT
    # settlement, and published an unfinished bar as the day's close.
    # Correctness does not depend on this time: fetchers/_settlement.py
    # drops the current session's bar on any run that lands early.
    - cron: '0 19 * * 1-5'
  workflow_dispatch: {}
  push:
    branches: [main]
    # Broadened by M17 #213. The old hand-kept seven-file list would have
    # silently missed app/templates/blocks/**, app/markets.py,
    # scripts/generate_site.py and every module added after it — a maintained
    # list that fails in exactly the direction that *doesn't* rebuild.
    paths:
      - 'app/**'
      - 'scripts/**'
      - 'analysis/**'
      - 'pipeline/**'
      - 'fetchers/**'
      - 'data/reference/players/**'
      - 'config.py'
      - 'main.py'

permissions:
  # write: the pipeline commits data/history/*.csv back to the repo — the
  # git-based persistence layer for snapshot-only sources (no cloud DB).
  contents: write
  pages: write
  id-token: write
  # issues: scripts/ci_layer_alert.py opens/closes the layer-outage issue
  issues: write

# One group, so two runs can never call deploy-pages at the same time.
#
# `cancel-in-progress` is conditional because a *push* run and a *scheduled*
# run are not worth the same. On 2026-08-11 four PRs merged inside 15 minutes
# (#209, #215, #216, #217), fanning out four full pipeline runs. Queueing them
# was strictly harmful: each re-downloaded every upstream — enough to exhaust
# the shared data.gov.in sample-key throttle and darken Layer 16 with HTTP 429
# (#212) — and each raced the others to push data/history back to main, which
# is how #218's deploy died. A superseded push run is worthless by
# construction: the run behind it regenerates the whole dashboard from an
# empty DB, so nothing it would have published is lost.
#
# Scheduled and manual runs are never cancelled *by* a later run of their own
# kind: the daily run is the one that must land, and a workflow_dispatch is
# someone waiting on a result. The remaining edge is a merge landing while the
# 19:00 UTC scheduled run is mid-flight — the push run cancels it and then
# publishes a strictly fresher dashboard itself, so the outcome is benign.
concurrency:
  group: pages
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  # The trusted path's only production consumer, and the reason trust/ is
  # merged rather than parked on a branch: it runs on every weekday build
  # against live MAGyP, so drift between trust/ and the v1 pipeline surfaces
  # the morning it appears instead of months later.
  #
  # Deliberately its own job, not a step in build-deploy. `continue-on-error`
  # covers a step *failing*, not a step being *slow*: the runner can walk up
  # to MAGYP_FOB_LOOKBACK_DAYS of circulars at MAX_RETRIES x REQUEST_TIMEOUT
  # each, which on a bad MAGyP day is minutes out of build-deploy's 30-minute
  # budget — spent before the dashboard is even generated. A separate job with
  # its own runner and its own timeout cannot delay or starve the publish at
  # all. Purely observational: nothing reads its output, and job-level
  # continue-on-error keeps a divergence from reddening the workflow. It stays
  # this way until the pilots in #194 reconcile cleanly.
  reconcile-trusted:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Reconcile MAGyP FOB (v1 vs trusted)
        run: python scripts/reconcile_magyp_fob.py

      - name: Upload reconciliation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: magyp-reconciliation
          path: data/reconciliation/magyp_fob.json
          if-no-files-found: warn

  build-deploy:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      generation_outcome: ${{ steps.generate_site.outcome }}
      promotion_outcome: ${{ steps.smoke_candidate.outcome }}
      deployment_outcome: ${{ steps.deployment_status.outputs.outcome }}
      postdeploy_outcome: ${{ steps.smoke_public.outcome }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry1.outputs.page_url || steps.deployment-retry2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run data pipeline
        env:
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FAS_API_KEY: ${{ secrets.FAS_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          # Layer 16 (India mandi). Without this, _api_key() falls back to the
          # published sample key, which is capped at 10 rows/page and shares a
          # global throttle — ~19 requests per run, and a merge burst of four
          # runs exhausted it and took the layer dark on 2026-08-11 (#212).
          # A personal key raises the page limit to 100, cutting the request
          # count (and the 429 exposure) ~10x. Unset resolves to empty and
          # falls back, so this is safe to ship ahead of the secret.
          DATA_GOV_IN_API_KEY: ${{ secrets.DATA_GOV_IN_API_KEY }}
        run: python main.py

      # Layer failures must be loud, not buried in logs: open/update a
      # `ci-alert` issue on hard failures, close it on the next green run.
      # Runs even when the pipeline step failed (crash -> alert too);
      # continue-on-error so a broken alerter never blocks the deploy.
      - name: Alert on failed data layers
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci_layer_alert.py

      # Render privately. Tombstones remain useful diagnostics inside the
      # candidate, but an incomplete candidate is never promoted over the
      # last trustworthy public edition.
      - name: Generate static site
        id: generate_site
        continue-on-error: true
        run: python scripts/generate_site.py --output-dir "$RUNNER_TEMP/mirror-market-candidate"

      # main.py already exported history, but the briefing is written to the
      # DB by generate_html.py (main.py never generates one) — so today's row
      # lands *after* that export. Without this second pass the briefings CSV
      # would never gain a row and every briefing would die with the runner,
      # which is the whole loss the table was added to prevent. The export is
      # idempotent and its empty/shrink/column guards make a re-run safe.
      - name: Export history after briefing
        if: ${{ !cancelled() }}
        run: python -c "from pipeline.history import export_history; export_history()"

      # Snapshot-only sources (AgRural, SAFEX, forward curve, CONAB,
      # inspections, Gulf bids, briefings) have no upstream history, and
      # data_freshness preserves last-known-good run state. The committed CSVs
      # under data/history/ are their persistence layer. main.py seeds the
      # empty runner DB from them at start and re-exports at end.
      # [skip ci] prevents the data commit from retriggering workflows.
      # !cancelled() because this step now runs after dashboard generation: a
      # failed dashboard build must not also cost us the day's data.
      - name: Commit history snapshots
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history
          if git diff --staged --quiet; then
            echo "No history snapshot changes."
            exit 0
          fi
          git commit -m "chore(data): daily history snapshot [skip ci]"

          # Push first and only rebase when main has actually moved, retrying
          # a bounded number of times.
          #
          # This step runs BEFORE the Pages upload/deploy below, so any
          # non-zero exit here means the dashboard is never published — a
          # data-persistence hiccup taking down the publish with it. That is
          # exactly how #218 went stale: two runs on 2026-08-11 each wrote a
          # `briefings` row for that same date with different text, so the
          # CSVs differed on one line at one primary key and the bare
          # `pull --rebase` stopped on a content conflict with no way to
          # resolve it.
          #
          # `-X theirs` is the resolution, and reads backwards: a rebase
          # replays our commit ONTO upstream, so it calls upstream "ours" and
          # the commit being replayed "theirs". This therefore means "prefer
          # our freshly exported snapshot". That is safe and correct because
          # data/history is generated, not authored — this run seeded its DB
          # from the committed CSVs at checkout (`import_history()`) and then
          # added today's fetch, so our export is at least as complete as
          # what we are replaying onto, and `export_history()`'s own
          # empty/shrink/column guards already refused to write a regression.
          # The strategy cannot reach beyond data/history: the commit stages
          # nothing else, so no other path can conflict.
          #
          # --autostash remains defensive for any generated tracked state;
          # the site candidate itself lives privately under RUNNER_TEMP.
          for attempt in 1 2 3; do
            if git push origin main; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — rebasing onto moved main."
            git pull --rebase -X theirs --autostash origin main
          done
          echo "::error::history snapshot push failed after 3 attempts"
          exit 1

      - name: Install Chrome for viewport smoke checks
        if: ${{ !cancelled() && steps.generate_site.outcome == 'success' }}
        uses: browser-actions/setup-chrome@v1

      - name: Verify candidate promotion contract
        id: smoke_candidate
        if: ${{ !cancelled() && steps.generate_site.outcome == 'success' }}
        continue-on-error: true
        run: python scripts/smoke_site.py --root "$RUNNER_TEMP/mirror-market-candidate" --browser

      - name: Upload Pages artifact
        if: ${{ steps.generate_site.outcome == 'success' && steps.smoke_candidate.outcome == 'success' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/mirror-market-candidate/

      # Pages deploys fail transiently (API blips, deployment-in-progress
      # races) — try up to 3 times, pausing between attempts, before the
      # job fails and the deploy-alert job raises an issue.
      - name: Deploy to GitHub Pages
        id: deployment
        if: ${{ steps.generate_site.outcome == 'success' && steps.smoke_candidate.outcome == 'success' }}
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before deploy retry 1
        if: ${{ steps.deployment.outcome == 'failure' }}
        run: sleep 30

      - name: Deploy to GitHub Pages (retry 1)
        id: deployment-retry1
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before deploy retry 2
        if: steps.deployment.outcome == 'failure' && steps.deployment-retry1.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (retry 2)
        id: deployment-retry2
        if: steps.deployment.outcome == 'failure' && steps.deployment-retry1.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Classify deployment outcome
        id: deployment_status
        if: ${{ always() && !cancelled() }}
        env:
          FIRST: ${{ steps.deployment.outcome }}
          SECOND: ${{ steps.deployment-retry1.outcome }}
          THIRD: ${{ steps.deployment-retry2.outcome }}
        run: |
          if [[ "$FIRST" == "success" || "$SECOND" == "success" || "$THIRD" == "success" ]]; then
            echo "outcome=success" >> "$GITHUB_OUTPUT"
          elif [[ "$FIRST" == "skipped" ]]; then
            echo "outcome=skipped" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=failure" >> "$GITHUB_OUTPUT"
          fi

      - name: Smoke the deployed public artifact
        id: smoke_public
        if: ${{ !cancelled() && (steps.deployment.outcome == 'success' || steps.deployment-retry1.outcome == 'success' || steps.deployment-retry2.outcome == 'success') }}
        continue-on-error: true
        run: python scripts/smoke_site.py --url "${{ steps.deployment.outputs.page_url || steps.deployment-retry1.outputs.page_url || steps.deployment-retry2.outputs.page_url }}" --browser

      - name: Enforce publication outcome
        if: ${{ !cancelled() && (steps.generate_site.outcome == 'failure' || steps.smoke_candidate.outcome == 'failure' || steps.smoke_public.outcome == 'failure') }}
        run: |
          echo "::error::Candidate generation, promotion, or post-deploy smoke failed. The candidate was not silently accepted."
          exit 1

  # Deploy failures must be loud, not buried in a red run nobody opens:
  # scripts/ci_deploy_alert.py keeps a rolling `ci-deploy-alert` issue —
  # opened when the deploy fails (all retries exhausted) or the CI gate
  # blocks it, closed by the next green deploy. GitHub emails the issue
  # to the repo owner, satisfying the alert-on-final-failure requirement.
  deploy-alert:
    needs: [check, build-deploy]
    if: ${{ always() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Raise or clear deploy alert
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/ci_deploy_alert.py
          "${{ needs.build-deploy.result }}"
          "${{ needs.check.result }}"
          "${{ needs.build-deploy.outputs.generation_outcome }}"
          "${{ needs.build-deploy.outputs.promotion_outcome }}"
          "${{ needs.build-deploy.outputs.deployment_outcome }}"
          "${{ needs.build-deploy.outputs.postdeploy_outcome }}"
