name: Update Dashboard

on:
  schedule:
    # Weekdays, nominally 19:00 UTC. GitHub's scheduler is best-effort and
    # runs late: across 30 observed scheduled runs the delay was +64 to
    # +298 min (median +138), so the real landing window is ~20:00–24:00 UTC.
    # That window is what this time is chosen for, not the cron string:
    #   CBOT settles 18:15 UTC (CDT) / 19:15 UTC (CST)  -> same-day settled
    #   Argentina MAGyP FOB publishes after ~15:05 UTC  -> same-day
    #   AMS Gulf bids (report 3147) ~18:48 UTC          -> same-day
    # Brazil CEPEA publishes after 21:01 UTC, so it is picked up on the
    # later landings only and stays D-1 in the worst case; a slot late
    # enough to guarantee it would routinely spill past UTC midnight.
    # The previous '0 12' landed ~14:15 UTC, ~4 h BEFORE the CBOT
    # settlement, and published an unfinished bar as the day's close.
    # Correctness does not depend on this time: fetchers/_settlement.py
    # drops the current session's bar on any run that lands early.
    - cron: '0 19 * * 1-5'
  workflow_dispatch: {}
  push:
    branches: [main]
    # Broadened by M17 #213. The old hand-kept seven-file list would have
    # silently missed app/templates/blocks/**, app/markets.py,
    # scripts/generate_site.py and every module added after it — a maintained
    # list that fails in exactly the direction that *doesn't* rebuild.
    paths:
      - 'app/**'
      - 'scripts/**'
      - 'analysis/**'
      - 'pipeline/**'
      - 'fetchers/**'
      - 'data/reference/players/**'
      - 'config.py'
      - 'main.py'

permissions:
  # write: the pipeline commits data/history/*.csv back to the repo — the
  # git-based persistence layer for snapshot-only sources (no cloud DB).
  contents: write
  pages: write
  id-token: write
  # issues: scripts/ci_layer_alert.py opens/closes the layer-outage issue
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  # The trusted path's only production consumer, and the reason trust/ is
  # merged rather than parked on a branch: it runs on every weekday build
  # against live MAGyP, so drift between trust/ and the v1 pipeline surfaces
  # the morning it appears instead of months later.
  #
  # Deliberately its own job, not a step in build-deploy. `continue-on-error`
  # covers a step *failing*, not a step being *slow*: the runner can walk up
  # to MAGYP_FOB_LOOKBACK_DAYS of circulars at MAX_RETRIES x REQUEST_TIMEOUT
  # each, which on a bad MAGyP day is minutes out of build-deploy's 30-minute
  # budget — spent before the dashboard is even generated. A separate job with
  # its own runner and its own timeout cannot delay or starve the publish at
  # all. Purely observational: nothing reads its output, and job-level
  # continue-on-error keeps a divergence from reddening the workflow. It stays
  # this way until the pilots in #194 reconcile cleanly.
  reconcile-trusted:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Reconcile MAGyP FOB (v1 vs trusted)
        run: python scripts/reconcile_magyp_fob.py

      - name: Upload reconciliation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: magyp-reconciliation
          path: data/reconciliation/magyp_fob.json
          if-no-files-found: warn

  build-deploy:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry1.outputs.page_url || steps.deployment-retry2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run data pipeline
        env:
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FAS_API_KEY: ${{ secrets.FAS_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python main.py

      # Layer failures must be loud, not buried in logs: open/update a
      # `ci-alert` issue on hard failures, close it on the next green run.
      # Runs even when the pipeline step failed (crash -> alert too);
      # continue-on-error so a broken alerter never blocks the deploy.
      - name: Alert on failed data layers
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci_layer_alert.py

      # The site orchestrator owns the page list (headline, players, eight
      # market pages) and M8 #150's failure-isolation policy: a failed market
      # page becomes a tombstone rather than yesterday's file, and any
      # tombstone exits non-zero. continue-on-error so the deploy still
      # uploads — the site stays usefully up while CI goes red below.
      - name: Generate static site
        id: generate_site
        continue-on-error: true
        run: python scripts/generate_site.py

      # main.py already exported history, but the briefing is written to the
      # DB by generate_html.py (main.py never generates one) — so today's row
      # lands *after* that export. Without this second pass the briefings CSV
      # would never gain a row and every briefing would die with the runner,
      # which is the whole loss the table was added to prevent. The export is
      # idempotent and its empty/shrink/column guards make a re-run safe.
      - name: Export history after briefing
        if: ${{ !cancelled() }}
        run: python -c "from pipeline.history import export_history; export_history()"

      # Snapshot-only sources (AgRural, SAFEX, forward curve, CONAB,
      # inspections, Gulf bids, briefings) have no upstream history — the
      # committed CSVs under data/history/ are the persistence layer. main.py
      # seeds the empty runner DB from them at start and re-exports at end.
      # [skip ci] prevents the data commit from retriggering workflows.
      # !cancelled() because this step now runs after dashboard generation: a
      # failed dashboard build must not also cost us the day's data.
      - name: Commit history snapshots
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history
          if ! git diff --staged --quiet; then
            git commit -m "chore(data): daily history snapshot [skip ci]"
            # --autostash: this step now runs after dashboard generation, so
            # the freshly written (tracked) docs/index.html is an unstaged
            # change and a plain `pull --rebase` would abort on the dirty
            # tree. Autostash sets it aside and restores it, keeping the new
            # dashboard in place for the Pages artifact upload below.
            git pull --rebase --autostash origin main
            git push origin main
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      # Pages deploys fail transiently (API blips, deployment-in-progress
      # races) — try up to 3 times, pausing between attempts, before the
      # job fails and the deploy-alert job raises an issue.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before deploy retry 1
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (retry 1)
        id: deployment-retry1
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before deploy retry 2
        if: steps.deployment.outcome == 'failure' && steps.deployment-retry1.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (retry 2)
        id: deployment-retry2
        if: steps.deployment.outcome == 'failure' && steps.deployment-retry1.outcome == 'failure'
        uses: actions/deploy-pages@v4

      # A tombstoned page reds the job here, AFTER the upload and deploy —
      # M8 #150's isolation policy: the site stays usefully up with a dated
      # error where the broken page was, and CI is loud about it rather than
      # the failure being invisible behind a green run. `continue-on-error`
      # on the generate step above is what defers the failure to this point.
      - name: Fail the run on a page tombstone
        if: ${{ !cancelled() && steps.generate_site.outcome == 'failure' }}
        run: |
          echo "::error::One or more pages were tombstoned — see the 'Generate static site' step."
          exit 1

  # Deploy failures must be loud, not buried in a red run nobody opens:
  # scripts/ci_deploy_alert.py keeps a rolling `ci-deploy-alert` issue —
  # opened when the deploy fails (all retries exhausted) or the CI gate
  # blocks it, closed by the next green deploy. GitHub emails the issue
  # to the repo owner, satisfying the alert-on-final-failure requirement.
  deploy-alert:
    needs: [check, build-deploy]
    if: ${{ always() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Raise or clear deploy alert
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci_deploy_alert.py "${{ needs.build-deploy.result }}" "${{ needs.check.result }}"
