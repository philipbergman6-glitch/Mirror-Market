name: Update Dashboard

on:
  schedule:
    # Weekdays at 12:00 UTC (after US market open, captures prior day settlement)
    - cron: '0 12 * * 1-5'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'scripts/generate_html.py'
      - 'app/templates/**'
      - 'app/charts.py'
      - 'analysis/**'
      - 'pipeline/**'
      - 'fetchers/**'
      - 'config.py'
      - 'main.py'

permissions:
  # write: the pipeline commits data/history/*.csv back to the repo — the
  # git-based persistence layer for snapshot-only sources (no cloud DB).
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  build-deploy:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run data pipeline
        env:
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FAS_API_KEY: ${{ secrets.FAS_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python main.py

      # Snapshot-only sources (AgRural, SAFEX, forward curve, CONAB,
      # inspections, Gulf bids) have no upstream history — the committed
      # CSVs under data/history/ are the persistence layer. main.py seeds
      # the empty runner DB from them at start and re-exports at end.
      # [skip ci] prevents the data commit from retriggering workflows.
      - name: Commit history snapshots
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history
          if ! git diff --staged --quiet; then
            git commit -m "chore(data): daily history snapshot [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Generate static dashboard
        run: python scripts/generate_html.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
