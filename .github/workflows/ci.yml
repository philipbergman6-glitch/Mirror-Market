name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # data/history/ is CI-owned: the daily deploy workflow snapshots it back to
  # main. Human branches must never carry CSV edits — a stale local export
  # merged over CI's fresher snapshot silently loses unrecoverable history.
  history-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Block manual data/history edits
        run: |
          # No --depth: checkout above already fetched full history, and a
          # shallow fetch of the base grafts a depth-1 orphan tip onto it.
          # The moment main advances after the branch point — which the daily
          # `chore(data): daily history snapshot` commit does routinely — that
          # tip shares no ancestry with HEAD and the three-dot diff dies with
          # `fatal: origin/main...HEAD: no merge base` (exit 128). The guard
          # then fails every PR it was meant to wave through, and its own
          # error message never prints. Latent since the guard was added; it
          # only stayed green because PRs happened to run before a snapshot
          # landed.
          git fetch origin ${{ github.base_ref }}
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD -- data/history/)
          if [ -n "$CHANGED" ]; then
            echo "::error::data/history/ is written only by the daily deploy workflow. Drop these files from the PR (git checkout origin/${{ github.base_ref }} -- data/history/):"
            echo "$CHANGED"
            exit 1
          fi

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy analysis pipeline fetchers

      - name: Tests with coverage
        run: pytest

      # The suite's own guards (tests/_guards.py) raise on a write inside
      # data/history/ and on any outbound connect, so this should never
      # fire. It stays because the leak it answers for (#84) was found by
      # reading `git status` after a run, and a guard with a hole in it
      # would otherwise be as silent as no guard at all.
      - name: Working tree is clean after the suite
        run: |
          DIRTY=$(git status --porcelain)
          if [ -n "$DIRTY" ]; then
            echo "::error::the test suite mutated the working tree — a test escaped its tmp dir (#84):"
            echo "$DIRTY"
            exit 1
          fi
