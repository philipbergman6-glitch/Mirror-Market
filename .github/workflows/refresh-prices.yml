name: Refresh Prices

# The fast path. It fetches three layers — prices, currencies, forward_curve —
# and republishes the site from them plus whatever the restored database
# already holds. Everything else about it is the daily build's code: same
# settlement guard, same cleaners, same freshness grading, same promotion
# contract. See LATENCY.md.
#
# WHY A SECOND SCHEDULED BUILD AT ALL
#
# The daily build is scheduled at 19:00 UTC and lands 20:00-24:00 UTC after
# GitHub's observed scheduler delay. That window straddles two closes it
# cannot reliably be on the right side of:
#
#   FX          the bar labelled D closes 17:00 New York = 21:00 UTC in EDT,
#               22:00 UTC in EST. A build landing at 20:30 gets D-1 FX, and
#               correctly so — the settlement guard drops the open bar.
#   CEPEA       publishes day D's indicator after 21:01 UTC.
#
# So the single daily build publishes FX and the Brazilian physical leg a day
# behind on any early landing. This run exists to close the FX half of that
# gap: 20:07 UTC nominal. The scheduler delay on this slot, measured over the
# thirteen runs of 2026-09-11 to 2026-09-29, was +1h54 to +3h35, so it lands
# 22:01-23:42 UTC — past the FX close on both sides of US DST, and a backstop
# for the board if the daily build landed early or failed.
#
# 20:07 is a two-sided choice and the window is narrow. The board objective
# is six hours from an 18:15 UTC settlement, so the fetch must land by 00:15
# UTC (01:15 in EST); FX needs it after 21:00 UTC (22:00 in EST). The slot
# was 21:30 until 2026-09-30: the delay grew from about +2h15 to +3h35 and
# +3h07 on 2026-09-28/29, both runs landed after 00:15, and both went red on
# a board breach after a deploy that had succeeded. 83 minutes earlier puts
# the worst observed delay at 23:42. An early landing (before the FX close)
# publishes D-1 FX, correctly, and the 23:30 catch-up picks FX up. The
# off-the-hour minute is deliberate: GitHub names the start of every hour as
# its highest-load, most-delayed moment.
#
# It also depends on the settlement-guard fix shipped alongside it. This run
# lands at 17:34-21:28 Chicago, and the CME overnight session opens 19:00 CT
# carrying the NEXT trade date. Under the old guard — "has Chicago settled?
# then keep everything" — the later landings would have stored that opening
# bar as the day's close. The rule is now "drop every bar after the newest
# finished session", which is what makes this slot safe at all.
#
# ONE DISPATCH, THREE SLOTS
#
#   dispatch  — DCE, on time. Dalian closes 15:00 CST = 07:00 UTC, so an
#               evening-only fetch is 13-17h late against the 6h board
#               objective, and the fetch has to land by 13:00 UTC. GitHub's
#               scheduler cannot do that: the `0 8` cron was started at
#               13:15-16:38 UTC on every weekday from 2026-09-21 to
#               2026-09-29 (+5h15 to +8h38) and went red on a dce breach
#               each time. The delay is wider than the window, so no cron
#               time fixes it. The on-time run is therefore a
#               `workflow_dispatch` with `layers=dce`, fired by a scheduler
#               outside GitHub: cron-job.org, 10:30 UTC on weekdays. Not
#               earlier, because Sina serves a mix of day-D and day-D-1
#               rows until about two hours after the close (measured
#               2026-09-30, LATENCY.md §4). A dispatch that lands before
#               any settled row exists stores D-1 and passes the pipeline
#               gates — a wasted run, never a wrong number — and reads as a
#               dce breach in the latency gate, which is the signal to fire
#               it later.
#   08:00 UTC — the DCE backstop, and the alarm on that outside scheduler.
#               If a dispatched dce run already succeeded today this slot
#               does nothing: fetching again hours later would re-stamp an
#               on-time number as a late one. If none did, it fetches dce
#               itself and is gated on it — late by construction, so red,
#               which is the point: the outside trigger did not fire. Sina's
#               daily endpoint was observed NOT to emit a next-trade-date
#               row from the 21:00 CST night session (probed 2026-08-19), so
#               a late landing is a breach risk, not a bad-data risk.
#   20:07 UTC — the FX/board refresh described above.
#   23:30 UTC — a catch-up. The gates make a redundant run a safe no-op, so
#               this exists purely to give FX and the board a second shot on
#               a day the 20:07 run failed or landed absurdly late.
#
# It deliberately does NOT re-scrape the physical origin legs. Those are
# scrapers against unfriendly upstreams and doubling their request rate
# trades reliability for freshness (the 2026-08-11 data.gov.in throttle
# blackout is the standing example). CEPEA staying D-1 is a known, stated
# product latency, not an oversight — LATENCY.md says so plainly.

# The dispatched DCE run is told apart from every other run by its name: the
# 08:00 backstop looks for a successful "Refresh Prices (dce)" today.
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && inputs.layers != ''
  && format('Refresh Prices ({0})', inputs.layers) || 'Refresh Prices' }}

on:
  schedule:
    - cron: '0 8 * * 1-5'
    - cron: '7 20 * * 1-5'
    - cron: '30 23 * * 1-5'
  workflow_dispatch:
    inputs:
      layers:
        description: >-
          Comma-separated layer keys to fetch (empty = the default
          prices,currencies,forward_curve set)
        required: false
        default: ''

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

# Same group as the daily build: two runs must never call deploy-pages at
# once. cancel-in-progress is FALSE here — a fast refresh that is superseded
# has nothing to hand over, and cancelling the daily build for a price
# refresh would trade twenty-six layers for three.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  slot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      layers: ${{ steps.slot.outputs.layers }}
      gate: ${{ steps.slot.outputs.gate }}
      skip: ${{ steps.slot.outputs.skip }}
    steps:
      # Which layers this slot fetches, and which layers its latency gate is
      # allowed to fail on. The gate is scoped to the layers the run just
      # fetched: an unscoped gate would be red every day on layers whose
      # acquisition breaches structurally (COT carries a 3-day provider
      # delay against a 24h target; the evening daily build re-stamps dce
      # 13-17h after the Dalian close).
      #
      # The 08:00 slot is a backstop: it stands down when the dispatched DCE
      # run has already succeeded today, and a failed lookup fails the run
      # rather than guessing either way.
      - name: Select layers for this slot
        id: slot
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          SKIP=false
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            LAYERS="${{ inputs.layers }}"
          elif [[ "${{ github.event.schedule }}" == "0 8 * * 1-5" ]]; then
            LAYERS="dce"
            ON_TIME=$(gh run list --workflow refresh-prices.yml \
              --event workflow_dispatch --status success \
              --created ">=$(date -u +%F)" --limit 50 --json displayTitle \
              --jq '[.[] | select(.displayTitle == "Refresh Prices (dce)")] | length')
            if [[ "$ON_TIME" -gt 0 ]]; then
              SKIP=true
              echo "::notice::dce was refreshed on time by a dispatched run today — backstop stands down"
            else
              echo "::warning::no successful dispatched dce refresh today — the outside scheduler did not fire; fetching dce late"
            fi
          else
            LAYERS=""
          fi
          if [[ -n "$LAYERS" ]]; then
            GATE="$LAYERS"
          elif [[ "${{ github.event.schedule }}" == "30 23 * * 1-5" ]]; then
            # The catch-up slot publishes; it does not prove latency. CBOT
            # settles 18:15 UTC and the board objective is six hours, so a
            # 23:30 cron that lands after 00:15 UTC — every observed run,
            # 2026-09-05 to 2026-09-29 landed 01:11-02:38 — breaches by
            # construction, after the deploy has already succeeded. A red
            # that cannot be green is a red nobody reads (#176). The report
            # still prints; only the exit code is ungated.
            GATE=""
          else
            GATE="prices,currencies,forward_curve"
          fi
          {
            echo "layers=$LAYERS"
            echo "gate=$GATE"
            echo "skip=$SKIP"
          } >> "$GITHUB_OUTPUT"
          echo "fetching: ${LAYERS:-default (prices,currencies,forward_curve)} | gating on: $GATE | skip: $SKIP"

  refresh:
    needs: slot
    if: needs.slot.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # A miss is not a failure. The refresh still runs, still generates, and
      # is then refused by the regression gate below because its coverage is
      # thinner than the published edition's — which is the correct outcome
      # and leaves the live site untouched.
      - name: Restore the database from the daily build
        id: db_cache
        uses: actions/cache/restore@v4
        with:
          path: data/storage/mirror_market.db
          key: mirror-market-db-
          restore-keys: |
            mirror-market-db-

      - name: Report cache state
        run: |
          if [[ "${{ steps.db_cache.outputs.cache-matched-key }}" == "" ]]; then
            echo "::warning::no cached database — this refresh will be refused by the regression gate"
          else
            echo "restored ${{ steps.db_cache.outputs.cache-matched-key }}"
          fi

      # Pipeline + generate + both gates, in one script so the gates cannot be
      # reordered or skipped by editing YAML. Exit codes: 1 pipeline, 2
      # generation, 3 promotion contract, 4 regression.
      - name: Fast refresh and gate the candidate
        id: refresh
        run: |
          EXTRA=()
          if [[ -n "${{ needs.slot.outputs.layers }}" ]]; then
            EXTRA+=(--layers "${{ needs.slot.outputs.layers }}")
          fi
          python scripts/refresh_prices.py \
            --output-dir "$RUNNER_TEMP/mirror-market-candidate" \
            --public-manifest "${{ vars.PAGES_URL || 'https://philipbergman6-glitch.github.io/Mirror-Market' }}/manifest.json" \
            "${EXTRA[@]}"

      - name: Install Chrome for viewport smoke checks
        uses: browser-actions/setup-chrome@v1

      - name: Verify candidate promotion contract
        run: python scripts/smoke_site.py --root "$RUNNER_TEMP/mirror-market-candidate" --browser

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/mirror-market-candidate/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # `--candidate` makes the smoke wait (bounded) until the public index
      # carries the stamp it just uploaded: Pages reports a deploy done before
      # its CDN serves it, and grading the previous edition fails a deploy
      # that succeeded (2026-09-17).
      - name: Smoke the deployed public artifact
        run: >-
          python scripts/smoke_site.py
          --url "${{ steps.deployment.outputs.page_url }}"
          --candidate "$RUNNER_TEMP/mirror-market-candidate"
          --browser

      # Re-cache so the next fast refresh builds on this one rather than on
      # the morning's daily build. Without it, two refreshes in a day would
      # each start from the same stale snapshot.
      - name: Re-cache the database
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: data/storage/mirror_market.db
          key: mirror-market-db-${{ github.run_id }}

      # Not continue-on-error: a breach in a layer THIS run was responsible
      # for fetching is a red run, not a log line. The deploy has already
      # happened by this step — the red flags the breach without harming the
      # published edition, which is fresher than not deploying it would be.
      - name: Gate the published edition's latency
        run: |
          GATE="${{ needs.slot.outputs.gate }}"
          python scripts/latency_report.py \
            --manifest "${{ steps.deployment.outputs.page_url }}manifest.json" \
            ${GATE:+--fail-on-breach-layers "$GATE"}
