name: Refresh Prices

# The fast path. It fetches three layers — prices, currencies, forward_curve —
# and republishes the site from them plus whatever the restored database
# already holds. Everything else about it is the daily build's code: same
# settlement guard, same cleaners, same freshness grading, same promotion
# contract. See LATENCY.md.
#
# WHY A SECOND SCHEDULED BUILD AT ALL
#
# The daily build is scheduled at 19:00 UTC and lands 20:00-24:00 UTC after
# GitHub's observed scheduler delay. That window straddles two closes it
# cannot reliably be on the right side of:
#
#   FX          the bar labelled D is the London day D and closes at London
#               midnight = 23:00 UTC in BST, 00:00 UTC in GMT (B20 #482; it
#               was first read as a 17:00 New York session, 21:00/22:00 UTC).
#               A build landing before that gets D-1 FX, and correctly so —
#               the settlement guard drops the open bar.
#   CEPEA       publishes day D's indicator after 21:01 UTC.
#
# So the single daily build publishes FX and the Brazilian physical leg a day
# behind on any early landing. This run was scheduled to close the FX half of
# that gap: 20:07 UTC nominal. The scheduler delay on this slot, measured over
# the thirteen runs of 2026-09-11 to 2026-09-29, was +1h54 to +3h35, so it
# lands 22:01-23:42 UTC — a backstop for the board if the daily build landed
# early or failed. Against the London close it is only sometimes past it in
# BST and never in GMT, so FX day D now arrives on the 23:30 catch-up, which
# lands 01:11-02:38 UTC, past the London close in both seasons.
#
# 20:07 is a two-sided choice and the window is narrow. The board objective
# is six hours from an 18:15 UTC settlement, so the fetch must land by 00:15
# UTC (01:15 in EST). FX cannot share that deadline: its close is 23:00 or
# 00:00 UTC, so no single slot both meets the board objective and lands past
# the FX close on every day. The slot
# was 21:30 until 2026-09-30: the delay grew from about +2h15 to +3h35 and
# +3h07 on 2026-09-28/29, both runs landed after 00:15, and both went red on
# a board breach after a deploy that had succeeded. 83 minutes earlier puts
# the worst observed delay at 23:42. A landing before the FX close
# publishes D-1 FX, correctly, and the 23:30 catch-up picks FX up. The
# off-the-hour minute is deliberate: GitHub names the start of every hour as
# its highest-load, most-delayed moment.
#
# B47 (#622) changed the board half of that reasoning. Yahoo's CBOT bar
# labelled D is final only at 00:00 New York on D+1 (04:00 UTC EDT, 05:00
# UTC EST), so neither evening slot can carry CBOT day D: both hold D-1 by
# design, and the board deadline arithmetic above (00:15 UTC) describes a
# guard that kept the bar from 14:30 CT, which stored pre-final values. The
# owner's decision on #622 (2026-11-25, Option A) gave the board its own
# slot after New York midnight — the `board` dispatch below — and a
# twelve-hour objective; the evening slots stay ungated for it.
#
# It also depends on the settlement-guard fix shipped alongside it. This run
# lands at 17:34-21:28 Chicago, and the CME overnight session opens 19:00 CT
# carrying the NEXT trade date. Under the old guard — "has Chicago settled?
# then keep everything" — the later landings would have stored that opening
# bar as the day's close. The rule is now "drop every bar after the newest
# finished session", which is what makes this slot safe at all — and since
# B47 (#622) the newest finished futures session is the one Yahoo finished at
# New York midnight, so this slot stores CBOT D-1, never D's live bar.
#
# TWO DISPATCHES, THREE SLOTS
#
#   dce       — DCE, on time. Dalian closes 15:00 CST = 07:00 UTC, so an
#               evening-only fetch is 13-17h late against what was then a
#               6h board objective (twelve since #622), and the fetch had
#               to land by 13:00 UTC. GitHub's
#               scheduler cannot do that: the `0 8` cron was started at
#               13:15-16:38 UTC on every weekday from 2026-09-21 to
#               2026-09-29 (+5h15 to +8h38) and went red on a dce breach
#               each time. The delay is wider than the window, so no cron
#               time fixes it. The on-time run is therefore a
#               `workflow_dispatch` with `layers=dce`, fired by a scheduler
#               outside GitHub: cron-job.org, 10:30 UTC on weekdays. Not
#               earlier, because Sina serves a mix of day-D and day-D-1
#               rows until about two hours after the close (measured
#               2026-09-30, LATENCY.md §4). A dispatch that lands before
#               any settled row exists stores D-1 and passes the pipeline
#               gates — a wasted run, never a wrong number — and reads as a
#               dce breach in the latency gate, which is the signal to fire
#               it later. It is also the BOARD BACKSTOP: on a day the
#               board was due (Tue-Fri here; the 10:30 job does not run
#               Saturday) and no `board` dispatch delivered since 00:00 New
#               York, it fetches prices,forward_curve as well, and its own
#               "Gate the board backstop" step goes red — the board trigger
#               did not fire. That step is separate so the dce half still
#               reads as delivered to the 08:00 backstop.
#   board     — the CBOT board, on time. `workflow_dispatch` with
#               `slot=board`, fired by cron-job.org at 01:00
#               America/New_York, Tue-Sat. The job MUST be scheduled in the
#               America/New_York timezone, not UTC: the bar is final at New
#               York midnight, so the trigger has to follow New York's DST
#               (05:00 UTC in EDT, 06:00 UTC in EST). Fetches and gates
#               prices,forward_curve against the twelve-hour board
#               objective (~10h50m on time). Not currencies: FX day D landed
#               on the 23:30 slot, and refetching it hours later would
#               re-stamp it later. 01:00, not 00:15: the midnight finality is
#               inferred from thin captures near the boundary, and
#               scripts/measure_cbot_bar_finality.py must show a week of
#               bars final within seconds of 00:00 before the slot moves.
#               Set up with scripts/setup_cbot_board_trigger.sh; diagnose
#               with scripts/check_cbot_board_trigger.sh.
#   08:00 UTC — the DCE backstop, and the alarm on that outside scheduler.
#               If a dispatched dce run already delivered today this slot
#               does nothing: fetching again hours later would re-stamp an
#               on-time number as a late one. If none did, it fetches dce
#               itself and goes red unconditionally — which is the point:
#               the outside trigger did not fire. (Until #622 it was red
#               through the 6h breach; the twelve-hour objective would let
#               its 13:15-16:38 UTC landing pass, so the red is explicit
#               now.) Sina's daily endpoint was observed NOT to emit a next-trade-date
#               row from the 21:00 CST night session (probed 2026-08-19), so
#               a late landing is a breach risk, not a bad-data risk.
#   20:07 UTC — the evening refresh described above; D-1 FX, D-1 CBOT.
#               Gates nothing.
#   23:30 UTC — the FX slot. It lands past the London close in both
#               seasons, so it is where FX day D first arrives; gated on
#               currencies only. CBOT is still D-1 here on nearly every run.
#
# It deliberately does NOT re-scrape the physical origin legs. Those are
# scrapers against unfriendly upstreams and doubling their request rate
# trades reliability for freshness (the 2026-08-11 data.gov.in throttle
# blackout is the standing example). CEPEA staying D-1 is a known, stated
# product latency, not an oversight — LATENCY.md says so plainly.

# A dispatched run is told apart from every other run by its name: the 08:00
# backstop looks for a delivered "Refresh Prices (dce)" today, and the 10:30
# UTC dce dispatch for a delivered "Refresh Prices (board)" since 00:00 New
# York (scripts/refresh_slot.py). A named slot wins over a layer list.
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && inputs.slot != ''
  && format('Refresh Prices ({0})', inputs.slot)
  || github.event_name == 'workflow_dispatch' && inputs.layers != ''
  && format('Refresh Prices ({0})', inputs.layers) || 'Refresh Prices' }}

on:
  schedule:
    - cron: '0 8 * * 1-5'
    - cron: '7 20 * * 1-5'
    - cron: '30 23 * * 1-5'
  workflow_dispatch:
    inputs:
      layers:
        description: >-
          Comma-separated layer keys to fetch (empty = the default
          prices,currencies,forward_curve set)
        required: false
        default: ''
      slot:
        description: >-
          A named slot instead of a layer list. 'board' = the CBOT board
          (prices,forward_curve), fired by cron-job.org at 01:00
          America/New_York Tue-Sat (owner decision on #622). Empty = none.
        required: false
        default: ''

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

# Same group as the daily build: two runs must never call deploy-pages at
# once. cancel-in-progress is FALSE here — a fast refresh that is superseded
# has nothing to hand over, and cancelling the daily build for a price
# refresh would trade twenty-six layers for three.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  slot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      layers: ${{ steps.slot.outputs.layers }}
      gate: ${{ steps.slot.outputs.gate }}
      skip: ${{ steps.slot.outputs.skip }}
      late_start_ok: ${{ steps.slot.outputs.late_start_ok }}
      backstop: ${{ steps.slot.outputs.backstop }}
      board_backstop: ${{ steps.slot.outputs.board_backstop }}
      board_gate: ${{ steps.slot.outputs.board_gate }}
    steps:
      - uses: actions/checkout@v4

      # Which layers this slot fetches, which layers its latency gate is
      # allowed to fail on, and whether a backstop stands down. The routing
      # lives in scripts/refresh_slot.py (stdlib-only: nothing is installed
      # yet) so tests/test_refresh_slot.py can prove it; read its docstring
      # for every slot. The gate is scoped to the layers the run just
      # fetched: an unscoped gate would be red every day on layers whose
      # acquisition breaches structurally (COT carries a 3-day provider
      # delay against a 24h target).
      #
      # Both backstops — 08:00 for DCE, the 10:30 UTC dce dispatch for the
      # board — read whether the on-time run delivered from that run's own
      # gate step, and a failed lookup fails this job rather than guessing.
      # Inputs reach the script through env, never interpolated into bash.
      - name: Select layers for this slot
        id: slot
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          LAYERS: ${{ inputs.layers }}
          SLOT: ${{ inputs.slot }}
        run: >-
          python3 scripts/refresh_slot.py
          --event "$EVENT" --schedule "$SCHEDULE"
          --layers "$LAYERS" --slot "$SLOT"
          --github-output "$GITHUB_OUTPUT"

  refresh:
    needs: slot
    if: needs.slot.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Restores the *verified seed* only (#453): verified/latest.db.gz in R2
      # (pipeline/db_snapshot.py), the newest database saved by a daily build
      # or refresh whose candidate passed the promotion contract. A refused
      # run's database never reaches that key. History tables arrive emptied
      # and are refilled from data/history/*.csv by main.py, as on the daily
      # build. --require-fresh: this path only ever fetches a short window, so
      # a seed older than config.SEED_SHORT_WINDOW_MAX_AGE_DAYS would leave a
      # gap; it is not placed. A miss of any kind is not a failure. The
      # refresh still runs, still generates, and is then refused by the
      # regression gate below because its coverage is thinner than the
      # published edition's — which is the correct outcome and leaves the
      # live site untouched.
      - name: Restore the verified seed
        id: db_seed
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python scripts/db_snapshot.py pull --require-fresh

      - name: Report seed state
        env:
          SEED_STATE: ${{ steps.db_seed.outputs.state }}
        run: |
          if [[ "$SEED_STATE" != "restored" ]]; then
            echo "::warning::no usable verified seed (${SEED_STATE:-restore failed}) — this refresh will be refused by the regression gate"
          fi

      - name: Stamp the refresh start
        run: echo "REFRESH_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      # Pipeline + generate + both gates, in one script so the gates cannot be
      # reordered or skipped by editing YAML. Exit codes: 1 pipeline, 2
      # generation, 3 promotion contract, 4 regression.
      - name: Fast refresh and gate the candidate
        id: refresh
        run: |
          EXTRA=()
          if [[ -n "${{ needs.slot.outputs.layers }}" ]]; then
            EXTRA+=(--layers "${{ needs.slot.outputs.layers }}")
          fi
          python scripts/refresh_prices.py \
            --output-dir "$RUNNER_TEMP/mirror-market-candidate" \
            --public-manifest "${{ vars.PAGES_URL || 'https://philipbergman6-glitch.github.io/Mirror-Market' }}/manifest.json" \
            "${EXTRA[@]}"

      - name: Install Chrome for viewport smoke checks
        uses: browser-actions/setup-chrome@v1
        with:
          # Stable channel, never `latest`: that value is the newest Chromium
          # *snapshot*, and the 2026-10-07 21:26 UTC deploy hung in headless
          # Chrome on a snapshot that had changed since the run three hours
          # earlier passed the same pages. The browser is part of the
          # promotion contract; it has to be as pinned as the Python deps.
          chrome-version: stable

      - name: Verify candidate promotion contract
        run: python scripts/smoke_site.py --root "$RUNNER_TEMP/mirror-market-candidate" --browser

      # Advance the verified seed, so the next fast refresh — and the next
      # daily build — start from this one rather than from the evening's
      # daily build: two refreshes in a day would otherwise each start from
      # the same older snapshot. Default `success()` condition, deliberately:
      # this step is reached only when scripts/refresh_prices.py passed both
      # its gates (promotion contract and regression) and the browser smoke
      # above passed too. A rejected refresh fails before here and never
      # advances the seed (#453).
      - name: Advance the verified seed
        id: db_push
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python scripts/db_snapshot.py push --run-id "${{ github.run_id }}-attempt-${{ github.run_attempt }}" --built-at "$REFRESH_STARTED_AT" --public-manifest "$RUNNER_TEMP/mirror-market-candidate/manifest.json"

      - name: Flag a failed seed advance
        if: ${{ steps.db_push.outcome == 'failure' }}
        run: echo "::error title=DB snapshot not saved::This refresh's verified database is not in R2; the next run starts from the previous seed. See the Advance the verified seed step."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/mirror-market-candidate/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # `--candidate` makes the smoke wait (bounded) until the public index
      # carries the stamp it just uploaded: Pages reports a deploy done before
      # its CDN serves it, and grading the previous edition fails a deploy
      # that succeeded (2026-09-17).
      - name: Smoke the deployed public artifact
        run: >-
          python scripts/smoke_site.py
          --url "${{ steps.deployment.outputs.page_url }}"
          --candidate "$RUNNER_TEMP/mirror-market-candidate"
          --browser

      # Not continue-on-error: a breach in a layer THIS run was responsible
      # for fetching is a red run, not a log line. The deploy has already
      # happened by this step — the red flags the breach without harming the
      # published edition, which is fresher than not deploying it would be.
      #
      # The step's NAME is read by scripts/refresh_slot.py (OWN_GATE_STEP):
      # its success is what "this run delivered on time" means to both
      # backstops. Renaming it silently disarms them; the slot tests pin it.
      - name: Gate the published edition's latency
        run: |
          GATE="${{ needs.slot.outputs.gate }}"
          LATE_START=""
          if [[ "${{ needs.slot.outputs.late_start_ok }}" == "true" ]]; then
            LATE_START="--late-start-is-not-a-breach"
          fi
          RC=0
          python scripts/latency_report.py \
            --manifest "${{ steps.deployment.outputs.page_url || steps.deployment-retry1.outputs.page_url || steps.deployment-retry2.outputs.page_url }}manifest.json" \
            ${GATE:+--fail-on-breach-layers "$GATE"} $LATE_START || RC=$?
          if [[ "${{ needs.slot.outputs.backstop }}" == "true" ]]; then
            # The backstop only fetches when no dispatched dce run delivered
            # today, so reaching here means cron-job.org did not fire. Red
            # by itself, not via a breach: the board objective is twelve
            # hours since #622, and this slot's 13:15-16:38 UTC landing
            # would otherwise meet it and pass the miss silently.
            echo "::error title=DCE trigger did not fire::No 'Refresh Prices (dce)' dispatch had delivered today when this backstop started ($(date -u +%H:%M) UTC; the trigger is due 10:30) — check the cron-job.org job (enabled? token valid?)."
            exit 1
          fi
          exit "$RC"

      # The board backstop (owner decision on #622): this dce dispatch also
      # fetched the board because no board dispatch delivered today. Its own
      # step, after the one above, so a dce run that delivered dce on time
      # still reads as delivered to the 08:00 DCE backstop. Red by itself:
      # reaching it means no board run delivered — the 01:00 New York
      # trigger did not fire, or its run failed its own gate.
      # !cancelled(): it must still run, and say why, when the dce gate above
      # failed — the run is red either way, but the cause would be lost.
      - name: Gate the board backstop
        if: ${{ !cancelled() && needs.slot.outputs.board_backstop == 'true' }}
        run: |
          RC=0
          python scripts/latency_report.py \
            --manifest "${{ steps.deployment.outputs.page_url || steps.deployment-retry1.outputs.page_url || steps.deployment-retry2.outputs.page_url }}manifest.json" \
            --fail-on-breach-layers "${{ needs.slot.outputs.board_gate }}" || RC=$?
          echo "::error title=CBOT board not delivered on time::No 'Refresh Prices (board)' run had delivered since 00:00 New York when this run started ($(date -u +%H:%M) UTC; the trigger is due 01:00 America/New_York, Tue-Sat), so the board was fetched here instead, late. Either the trigger did not fire (no board run today: scripts/check_cbot_board_trigger.sh) or the board run failed its own gate (a red board run today: open it; after a CBOT holiday that is expected, no calendar yet). Latency report exit: $RC."
          exit 1
