# Fly app for the hosted MCP edition (#579). One shared-cpu-1x machine, the
# daily DB baked into the image by the deploy workflow; the volume holds only
# the question log, which must survive the daily redeploy.
app = "mirror-market-mcp"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  MIRROR_MCP_DB_PATH = "/app/db/mirror_market.db"
  MIRROR_MCP_LOG_PATH = "/data/questions.jsonl"
  MIRROR_MCP_HOST = "0.0.0.0"
  MIRROR_MCP_PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[mounts]
  source = "mcp_log"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
