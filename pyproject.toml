[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov --cov-fail-under=70"
markers = [
    "network: test genuinely needs the internet; exempts it from the outbound-connection guard (tests/_guards.py)",
]

[tool.coverage.run]
source = ["pipeline", "analysis", "app", "trust", "pricing"]
omit = [
    "tests/*",
    "scripts/*",
    "fetchers/*",
    "main.py",
    "config.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [
    ".venv",
    "docs",
    "data",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "DTZ003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# generate_html.py builds long HTML f-strings; wrapping hurts readability
"scripts/generate_html.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict_equality = true
ignore_missing_imports = true
warn_unused_ignores = true
exclude = [
    "^\\.venv/",
    "^docs/",
    "^data/",
    "^scripts/",
]

# The checked surface is `analysis` and `pipeline` — what CI passes on the
# command line. `exclude` above does not bound it: it only applies to files mypy
# discovers by crawling directories, and an imported module is followed
# regardless. So the checked set has always been "analysis and pipeline, plus
# whatever they happened to import", and the modules below were outside it by
# accident of nobody importing them rather than by anyone deciding they were
# clean. Phase 5 imports the promotion contract (`trust.site_promotion`, for the
# feature-coverage denominator and the deployment drill) and the real tombstone
# path (`scripts.generate_site`, so the page-generation drill rehearses against
# the artifact the daily build actually writes) — which drags their whole
# transitive graph in and surfaces 89 pre-existing errors in code this phase
# does not touch.
#
# `ignore_errors` rather than `follow_imports = "skip"` deliberately: skipping
# would make every symbol imported from these modules `Any` and quietly stop
# type-checking the Phase 5 code that calls them, which is the opposite of what
# is wanted. This suppresses errors *inside* the unchecked modules while keeping
# their signatures, so the checked surface is unchanged and the new code is
# still checked against real types.
#
# Removing an entry here is how one of these modules gets adopted into the
# checked set. That is a deliberate piece of work, not a side effect of an
# unrelated import.
[[tool.mypy.overrides]]
module = [
    "app.block_builders",
    "app.markets",
    "app.sections",
    "fetchers.*",
    "generate_site",
    "scripts.generate_site",
    "trust.dataset_health",
    "trust.derived",
    "trust.quality",
    "trust.query_cache",
    "trust.registry",
    "trust.site_promotion",
]
ignore_errors = true
