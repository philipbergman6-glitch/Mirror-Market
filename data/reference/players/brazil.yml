# Brazil soy players — exporters/originators (#88). Research date 2026-08-07.
#
# Scope note: entries are limited to genuine mid-large INTERNATIONAL shippers of
# soy complex from Brazil. ABIOVE associates page (https://abiove.org.br/en/associates/,
# accessed 2026-08-07) lists: 3 Tentos, ADM, Agrex, Amaggi, BTG Pactual, Bunge,
# Cargill, CHS, CJ Selecta, COFCO International, Dual, Fiagril, Imcopa, JBS, LDC,
# Óleos Menu, Olfar. The ABIOVE exp_YYYYMM.xlsx (exp_202606.xlsx parsed 2026-08-07)
# has NO company-level breakdown — only product × month, destination region, and
# port/arch (Arco Norte 34.4% share Jan–Jun 2026; beans Jan–Jun 2026 = 69.58 Mt).
# No free source publishes a current per-company tonnage ranking (Trase latest
# vintage = 2022; ANEC/Cargonave per-trader tables not open — see #73).
#
# DROPPED (evaluated, not international soy shippers — reasons, all accessed 2026-08-07):
# - JBS: no evidence of soy origination/export; membership presumably via biodiesel arm (inferred).
# - Imcopa: bankrupt; Bunge's 2020 plant purchase collapsed; post-2023 auction outcome unverified.
# - BTG Pactual Commodities: financial trader; only aggregator (Volza) evidence of modest
#   soybean shipments — too weak to profile.
# - Dual, Óleos Menu, Binatural: small/biodiesel-domestic ABIOVE members; no export evidence found.
# - Sodrugestvo Brazil (Aliança Agrícola do Cerrado): shut all Brazil ops Jan 2026, 344 layoffs
#   (timesbrasil.com.br / theagribiz.com).
# - Gavilon do Brasil / Viterra / Glencore Agriculture Brazil: absorbed into Bunge
#   (Viterra merger closed 2025-07-02).
# - Sperafico: judicial recovery 2023, R$1.3bn debt — not a meaningful exporter now.
# - Engelhart CTP: exited physical S.American grain origination (now financial/energy).
# - Multigrain (Mitsui): closed 2018.
# - Bom Futuro, Grupo Scheffer: producers selling to trading houses, not direct exporters.
# - Unium co-ops (Castrolanda/Frísia/Capal): dairy/pork/flour brand, no soy export program.
# - Cutrale: 2015-era soy diversification; no 2025–26 soy export evidence — unverified.

