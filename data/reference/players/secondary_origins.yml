# Secondary soy origins — Canada, Ukraine, Russia, Uruguay, Bolivia (#108)
# Sell-side players outside the big four origins (US/BR/AR/PY).
# Origin-level context (all observed unless noted):
# - Canada: 2025-26 exports forecast ~5.4 MMT vs 5y avg 4.33 MMT (AAFC May 2025);
#   2025 production 7.13 MMT (StatCan). Distinct food-grade/IP niche to Japan.
# - Ukraine: MY2024/25 record ~4.0-4.2 MMT bean exports; MY2025/26 fell to 2.7 MMT
#   after a 10% soybean export duty (Sep 2025) pushed volume into domestic crush
#   (~2.9 MMT, +51% vs 5y avg). Top buyers 2024/25: Turkey, Egypt, Netherlands.
# - Russia: bean exports 1.04 MMT in H1 2026 (+230% y/y, China ~620 kt); meal
#   exports emerging (230 kt Q1 2026). Tariff quotas on bean exports from
#   Primorsky/Amur/Kaliningrad from 2026-01-01; 20% bean export duty favours meal.
# - Uruguay: 2025-26 exports ~2.1 MMT, 2026-27 projected 2.8 MMT; China >80% of
#   shipments; ~70% ships via Nueva Palmira, ~30% via Montevideo (USDA FAS).
# - Bolivia: meal-led exporter — 2024 output 1.7 MMT solvent meal; ~80% of meal
#   exported; six crushers control ~85% of byproduct output (ABI, Jun 2025).

