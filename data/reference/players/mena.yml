# MENA soy-complex players — Egypt / Turkey / Iran / North Africa / Gulf (#107)
# Schema: data/reference/players/README.md. as_of 2026-08-08.
# Egypt is a top-5 world bean importer (USDA FAS: 5.2 MMT forecast MY 2026/27, ~70% US-origin
# recently; domestic production <2% of demand). Turkey heading to record 4.4 MMT bean imports
# MY 2026/27. Iran buys meal via state tenders under sanctions-constrained payment channels.
# North Africa: Algeria state tenders (ONAB) + new crush; Tunisia one dominant crusher;
# Morocco private feed millers buying meal (largest MENA market for US soybean meal).
# Gulf: Saudi feed integrators buy meal; UAE hosts a large multi-seed crush plant.

