# Paraguay soy players — issue #91
# Sources hierarchy: CAPPRO (crusher chamber, cappro.org.py) member list [observed];
# CAPECO (exporter chamber, capeco.org.py) publishes per-company export SHARE rankings
# monthly [observed for the 2025 full-year article]. Banco Central del Paraguay publishes
# only aggregate trade values — NO per-company export data was found at BCP or at DNIT
# customs (DNIT publishes an exporter/withholding-agent registry PDF, names only, no
# volumes). CAPECO is the only free per-company flow source identified.
# Transshipment honesty: Paraguayan customs "destinations" are first destinations.
# 2025: Argentina 80%, Brazil 14%, Russia 4% (CAPECO). The Argentina share is mostly
# barged down the Paraná–Paraguay waterway to up-river Rosario/San Lorenzo crush plants,
# processed, and re-exported as Argentine-origin products (incl. to China — Paraguay has
# no diplomatic ties with Beijing, so origin-change via Argentine crush is the China
# route, per CAPECO). Uruguay's Nueva Palmira is the other transshipment/top-off hub.
# Ultimate destinations therefore differ materially from customs first-destinations.

