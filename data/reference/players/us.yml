# ── Scale-evidence verdict (research question 3) ─────────────────────────────
# Best repeatable FREE evidence of relative US exporter scale: NONE at company level.
# - FGIS Export Grain Inspection reports (fgisonline.ams.usda.gov/exportgrainreport,
#   annual, updated through 2026) aggregate by port/region and commodity — no company axis.
# - FGIS Registered Grain Exporters Directory (annual, Jan 1; JS grid, PDF fallback) is a
#   name/address registry of entities exporting >=15,000 MT/yr — presence proof only, no volumes.
# - Census/FAS GATS trade data is country x commodity, never company.
# - Company-level rankings exist only in paid bill-of-lading databases (Panjiva/ImportGenius),
#   and bulk grain largely evades manifest data anyway.
# => This file therefore uses disclosed facility capacity/throughput as the scale proxy,
#    which is honest but NOT market share. (Citations: fgisonline.ams.usda.gov/exportgrainreport;
#    https://www.ams.usda.gov/content/usda-opens-annual-us-grain-exporter-registration-2026 —
#    both accessed 2026-08-07.)
