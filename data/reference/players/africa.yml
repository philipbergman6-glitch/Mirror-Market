# ---------------------------------------------------------------------------
# East Africa country-level context (not player entries):
#
# Ethiopia (accessed 2026-08-08):
# - NO soybean export ban: the edible-oil association requested one in 2023;
#   the State Minister for Industry called it "not feasible" (Milling MEA).
#   Cereal-grain export bans do not list soy. Negative finding, moderately
#   confident.
# - China opened for Ethiopian soybean MEAL 2025-07-03 (GACC phytosanitary
#   protocol; MoA-approved + GACC-registered plants only; volumes expected
#   small per JCI). People's Daily + GACC lists + USDA Beijing CH2026-0032.
# - Bean destinations: India 60% of 2022 export value (Wiley study);
#   2024-25 shipment data shifts toward Pakistan/Kenya/UAE; ~29,400 t beans
#   to China in 2024.
#
# Uganda (accessed 2026-08-08):
# - Net exporter: beans to Kenya ($4.26m) + Rwanda ($2.04m) in 2024 (OEC);
#   meal/oil-cake to Kenya $18.9m in 2023 (UN Comtrade) — the meal flow is
#   ~4x the bean flow by value; Lira crush (Mukwano/Mount Meru) feeds Kenya.
# - National Oilseeds Project (NOSP): ~$160m GoU/IFAD program 2021-2028,
#   soybean among 4 target oilseeds; Nov-2025 IFAD supervision: 48,853
#   households reached (40% of target), "moderately satisfactory".
# - Exchange status: old UCE defunct; warehouse-receipt authority merged
#   into the Trade Ministry; successor UNCE (80% private / 20% govt) not
#   yet operational (inferred from official phrasing).
# - Aponye (U) Ltd — grain trader with a soy retail line — is financially
#   distressed post-2023 (UGX 38bn debt, bailout ordered 2025); recorded
#   here rather than entered as a healthy incumbent.
#
# Kenya (accessed 2026-08-08):
# - Meal imports ~100k t/yr (USDA PSD via IndexMundi; 2022: 47k -> 2023-24:
#   100k). Origins: Zambia >70% of 2021-22 meal imports (CAK); beans 2024:
#   Tanzania 79%, Uganda 11% (IndexBox). Feed industry: formal commercial
#   ~600k t/yr (CAK) vs 2.5m t/yr incl. informal (AKEFEMA) — different
#   scopes. Soy = ~25% of feed volume but 44% of value (CAK).
# - GMO whipsaw: 2022 Cabinet lift -> 2023 High Court upheld -> 2025-03-07
#   Court of Appeal conservatory order BLOCKS GE imports pending appeal;
#   USDA FAS FAIRS 2026 says the ban is being enforced. Practical effect:
#   no US/LatAm meal — the non-GM corridor (Zambia/Malawi/Uganda/Tanzania,
#   cleared largely through ETG/Mount Meru-class traders) sets Kenyan
#   feed-input pricing. Final appeal ruling: gap.
# - EAC/COMESA preferences make regional sourcing effectively duty-free;
#   recurring ad-hoc duty waivers on feed inputs (2021, 2022, 2023, 2025).
#
# Tanzania (stretch, no entries — see research doc s.3): bean exporter
# (2023: $92.7m, China/India/Pakistan-led) but meal importer (~135k t/yr
# feed-sector need, Zambia-led — USDA FAS TZ2025-0003); crush mostly
# sunflower (Mount Meru); Silverlands Tanzania = integrated poultry/feed
# anchor (72k t/yr feed). Kenya-flow inconsistency (OEC 2023 $282k vs
# IndexBox 2024 79%-of-imports) flagged unresolved in the research doc.
