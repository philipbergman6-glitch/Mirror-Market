# ===========================================================================
# East Africa — Ethiopia / Uganda / Kenya (#135, research date 2026-08-08)
# Market shape: Ethiopia is a genuine bean + meal EXPORTER (India historically
# dominant; Pakistan/Kenya/UAE rising; China opened for Ethiopian soybean meal
# Jul 2025 via GACC protocol). Uganda is a small producer but regional net
# exporter — beans and (bigger by value) soybean meal into Kenya. Kenya is the
# structural BUYER: ~100k t/yr meal imports, no large-scale domestic crush
# (Competition Authority of Kenya 2024 inquiry, verbatim), sourced from
# Zambia/Malawi/Uganda/Tanzania because the GE-import regime blocks
# US/LatAm-origin meal (Court of Appeal conservatory order Mar 2025 restored
# the block after the 2022 lift; USDA FAS FAIRS 2026 says the ban is enforced).
# Trade mechanics: no functioning futures market anywhere in the block. ECX
# lists soybean spot contracts (thin liquidity, Wednesdays only); Uganda's
# exchange is being reconstituted (UNCE, not yet operational); Kenya buys
# through regional crusher-traders (ETG, Mount Meru) and direct imports.

