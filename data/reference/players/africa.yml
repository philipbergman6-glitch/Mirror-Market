# Africa soy players — South Africa + Nigeria (#109) + East Africa: Ethiopia,
# Uganda, Kenya (#135, research/2026-08-08-issue-135-east-africa-players.md)
# SA: self-sufficient crusher market trading around SAFEX (JSE), surplus meal/oil
# exported to SACU/SADC neighbours. Nigeria: import-substitution story — poultry
# feed demand pulling domestic crush; FX-constrained imports; no verified federal
# soybean export ban (see per-entry notes).
#
# Market-access mechanics (cited in entries below):
# - South Africa: physical trade prices against JSE Commodity Derivatives (SAFEX
#   legacy) soybean futures — ZAR/ton, physically settled via transferable
#   electronic silo receipts at registered silos; EFP facility for off-exchange
#   deals; "no limits apply to individuals, foreigners or corporate entities" per
#   JSE, but access is through an authorised JSE member/broker with margin posted.
# - Nigeria: no functioning national futures market for soy. Aggregation runs
#   through AFEX's warehouse-receipt spot platform and direct offtake contracts
#   with crushers/feed millers; import legs are negotiated direct (crude oil
#   cargoes), historically constrained by CBN FX restrictions (2015–Oct 2023) and
#   naira scarcity rather than formal tenders.

