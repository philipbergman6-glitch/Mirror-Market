# ---------------------------------------------------------------------------
# Country-level context (not player entries — kept as comments per schema):
#
# South Africa regional flows (observed, USDA FAS/Grain SA/Freight News,
# accessed 2026-08-08):
# - 2025/26 soybean crop revised up to a record ~3.0m t (CEC via Freight News);
#   USDA FAS Oilseeds Annual 2026 forecasts record production, crush and
#   exports, with surplus meal "increasingly exported to regional markets" and
#   soybean exports >300,000 t in 2025/26.
# - Historic destination pattern: soy product exports went almost entirely to
#   African neighbours — Botswana, Mozambique, Namibia, Lesotho, Angola; soy
#   OIL mainly Zimbabwe (~61%) and Zambia (~36%) (USDA FAS via Grain SA).
# - Zambia is the emerging regional competitor (surplus ~80,000 t meal in
#   2025/26 per Ecofin Agency).
#
# Nigeria policy honesty (accessed 2026-08-08):
# - No verified federal soybean export ban was found. The record shows: (a) the
#   old Export (Prohibition) Act bans maize, rice, "beans" (cowpeas), cassava,
#   yam — soybeans NOT on the statutory list (USDA FAS NI2024-0007); (b) 2021
#   Poultry Association of Nigeria CALLS for a soybean/maize export ban
#   (ThisDay/allAfrica) — pressure, not law; (c) maize appears on the FG's 2026
#   export-prohibited list (Legit.ng) — soybeans again not confirmed on it.
#   Reports of a 2021-22 maize/soya export ban belong to GHANA, not Nigeria —
#   a common conflation. Ticket's "soybean export ban history" is therefore
#   recorded as recurring ban pressure + adjacent grain bans, not an enacted
#   soy ban. If a gazetted soybean ban exists, it was not found free.
# - FX constraint history: CBN's 2015 41-item FX restriction (incl. vegetable
#   oil) pushed oil importers to the parallel market until lifted Oct 2023
#   (ThisDay/CBN); refined vegetable oil in retail packs remains import-
#   prohibited while crude oil for industrial refining is allowed — the
#   protection that underpins WASIL/Olam refinery economics.
#
# Ticket candidate NOT entered: "KAM" — the only KAM entities found in
