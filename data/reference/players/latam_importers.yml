# Latin America importers — Mexico + Andean/Central America (#110)
# Schema: data/reference/players/README.md. as_of 2026-08-08.
# Context (USDA FAS MX2026-0020, accessed 2026-08-08): Mexico soybean imports
# ~6.7 MMT forecast MY2026/27, ~96% of consumption, virtually all US-origin;
# installed crush capacity ~11.5 MMT CY2026 at ~60% utilization. Crush capacity
# concentration (earlier FAS reporting via AgFlow): Ragasa ~40%, Agydsa-Patrona
# ~22%, Proteinas y Oleicos ~13%, Cargill ~11%, ADM ~6% (~92% in five firms).
# Logistics: ~55-60% of whole beans and nearly 100% of meal/oil enter by rail
# (100-car shuttle trains, CPKC ex-KCS); US supplies ~94% of bean, ~90% of meal,
# ~65% of oil imports (United Soybean Board).

