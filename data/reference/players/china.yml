# China soy players — importers / crushers / state buyers (ticket #104)
# Schema: data/reference/players/README.md. All accessed dates 2026-08-08.
#
# Market-structure context (verified 2026-08-08):
# - China imported a record ~111.8 MMT of soybeans in 2025 (+6.5% YoY); Brazil
#   supplied ~73.6% (Reuters via marketscreener; farmpolicynews.illinois.edu).
# - Who books cargoes: a two-track system. State-owned COFCO and Sinograin book
#   the US cargoes (policy commitments + strategic reserves — customs data show
#   Beijing-registered state firms were the ONLY buyers of the 8.38 MMT of US
#   beans imported in early 2026), while private crushers and the multinationals
#   (Cargill, Bunge, LDC, Wilmar/Yihai Kerry — see global.yml) book Brazilian
#   cargoes directly, preferring higher-protein Brazilian beans (czapp.com;
#   S&P Global 2026-02). There is no import state-tender monopoly like Egypt's
#   GASC; large crushers import directly, and state supply-chain groups
#   (Xiamen C&D) act as financing intermediaries for smaller processors.
# - Top-10 crushers hold ~80-85% of crush volume; national crush capacity
#   ~140-200 MMT (estimates vary) vs ~95-108 MMT actually crushed — heavy
#   overcapacity, 55-70% utilization (dimsums.blogspot.com; USDA FAS).

