# India soy players — importers / crushers / refiners (issue #92)
# Research date 2026-08-07. Sources: SOPA solvent-extraction-plant directory
# (all 14 pages fetched directly 2026-08-07 — capacity figures below labelled
# "SOPA directory" are observed from those pages; directory vintage is NOT
# dated by SOPA and includes at least one company that went through
# insolvency (K.S. Oils), so treat SOPA TPD figures as indicative, not current),
# company sites/filings via search, and 2026 trade press.
#
# Market context (2026-08-07): India imports soy OIL heavily (~55-60% of all
# edible-oil consumption is imported) but soybean BEANS barely cross the
# border (GM restrictions); 2025-26 soymeal exports collapsed (~0.9 MMT
# expected vs 2.02 MMT prior year; Bangladesh offtake -46%; May/Jun contract
# washouts) and India approved additional ports for bulk soymeal IMPORTS —
# so "meal exporter" tags below describe structural role, not current flow.

