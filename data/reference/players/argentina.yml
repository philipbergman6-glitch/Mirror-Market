# Argentina soy-complex players — issue #90
# Research date 2026-08-07. Schema: data/reference/players/README.md
#
# DJVE attribution answer (research question 2), established honestly:
#   - The DAILY public DJVE feed is AGGREGATE ONLY. MAGyP's "Compras y DJVE de
#     Granos" statistics page publishes weekly/daily volumes by product (wheat,
#     corn, soybeans, sunflower...) split only into "Compras Sector Exportador"
#     vs "Compras de la Industria" — no company field. [observed 2026-08-07:
#     https://www.magyp.gob.ar/sitio/areas/ss_mercados_agropecuarios/areas/granos/_archivos/000058_Estad%C3%ADsticas/000020_Compras%20y%20DJVE%20de%20Granos.php]
#   - Company-level DJVE attribution DOES exist, but only at low frequency:
#     (a) MAGyP publishes an annual "Ranking Exportaciones por Exportador de
#         Granos y Subproductos" (files Ranking_Exportaciones_Actual + yearly
#         2016-2023) on its exportaciones page [observed 2026-08-07 — link list
#         seen; file contents not opened this session];
#     (b) BCR (Bolsa de Comercio de Rosario) publishes company rankings built
#         from DJVE records: full-season (e.g. 2023/24), calendar-year and
#         semester cuts [observed via BCR/press 2026-08-07].
#   - Per-declaration company detail (who registered which DJVE on which day)
#     is NOT published anywhere free that this research could find. The daily
#     company-resolution complement is vessel lineups (NABSA PDF names the
#     charterer per vessel) — flow, not sales.
#   - datos.magyp.gob.ar dataset search for "DJVE" returned no results
#     [observed 2026-08-07].
#
# Ranking anchor used below ("BCR 2023/24 ranking", DJVE-based, total
# 89.82 Mt all grains+products): Viterra 13.55 Mt, Cargill 11.37, COFCO 10.35,
# Bunge 8.72, AGD 8.65, LDC 8.57, ADM 8.04, ACA 5.65, Molinos Agro 5.15,
# CHS 1.37. H1-2026 (post Bunge-Viterra integration): Bunge 11.6 Mt, Cargill
# 8.1, COFCO 6.4. [observed via World Grain / ArgenPorts-BCR press, 2026-08-07]
#
# Capacity anchor: BCR survey — Gran Rosario ~80% of national crush capacity;
# 20 plants ~165,700-165,800 t/day in the hub, national active ~207,800 t/day.
# Per-plant figures cited below are from BCR's survey reporting (2021 survey —
# the latest per-plant table found free; no 2025 refresh located).

