# China soybean import policy rates.
#
# These are the only shipped assumptions in this directory, and they are here
# because they are PUBLISHED POLICY RATES rather than price estimates: an
# ad-valorem duty and a VAT rate are facts of the tariff schedule, not somebody's
# view of the freight market. They still carry an owner, a basis and an expiry,
# for the same reason everything else here does — a policy rate that changed
# last quarter is exactly as wrong as a stale freight number, and rather less
# likely to be noticed.
#
# PROVENANCE: both rates are the ones this repository already states, in
# config.MARKETS["dalian"]["basis"] ("bounded by freight, tariff (3%) and VAT
# (9%), not closed to zero") and in the Layer 9 section of LAYERS.md. They were
# not re-derived for Phase 2 and are recorded as `indicative` on that basis.
#
# KNOWN LIMITATION, and the reason both entries are destination-scoped rather
# than global: China has at times applied ORIGIN-DIFFERENTIATED retaliatory
# duties on US-origin soybeans on top of the MFN rate. That is not modelled
# here. If a retaliatory rate is in force, enter an origin-scoped duty — it
# wins on specificity and overrides these — rather than editing these entries:
#
#   python scripts/enter_assumption.py --component import_duty --value 0.28 \
#     --unit fraction --origin us_gulf --destination cn_north \
#     --basis "MFN 3% + retaliatory 25%" --entered-by you@example.com \
#     --expires 2026-12-31 --confidence indicative
#
# Reading this file as complete tariff coverage would understate the US landed
# cost in exactly the periods when the answer matters most.

- id: import_duty.cn_north.mfn
  component: import_duty
  value: 0.03
  unit: fraction
  destination: cn_north
  basis: >-
    China MFN ad-valorem import duty on soybeans, applied to the CIF value.
    Origin-differentiated retaliatory duties are NOT included — see the file
    header.
  source: "repo-established (config.MARKETS['dalian']['basis'], LAYERS.md Layer 9)"
  entered_by: "mirror-market phase-2 build (repo constant, not a trader entry)"
  entered_at: 2026-08-18
  expires_on: 2027-02-18
  confidence: indicative
  citation: "config.py MARKETS['dalian']['basis'] arbitrage note"

- id: import_vat.cn_north
  component: import_vat
  value: 0.09
  unit: fraction
  destination: cn_north
  basis: >-
    China import VAT on soybeans, applied to the duty-paid value. Charged on
    top of duty, which is why the landed waterfall applies it at its own rung
    rather than adding the two rates together.
  source: "repo-established (config.MARKETS['dalian']['basis'], LAYERS.md Layer 9)"
  entered_by: "mirror-market phase-2 build (repo constant, not a trader entry)"
  entered_at: 2026-08-18
  expires_on: 2027-02-18
  confidence: indicative
  citation: "config.py MARKETS['dalian']['basis'] arbitrage note"
